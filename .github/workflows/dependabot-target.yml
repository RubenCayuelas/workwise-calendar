name: Dependabot target

# Dependabot obeys `target-branch` for a VERSION update and ignores it for a SECURITY update: those
# always open against the repository's default branch, which is `main`. `main` receives releases and
# nothing else, so every one of them had to be retargeted by hand — four of the five open at once on
# 2026-09-14. This moves them to `dev` as they arrive.
#
# `pull_request_target`, not `pull_request`: a workflow a Dependabot pull request triggers is handed a
# READ-ONLY token, and changing a base needs write. The `permissions` block below is what makes it
# writable — it is the whole reason the elevated trigger is here. Nothing in this file checks out the
# pull request's code, so the trigger reaches nothing Dependabot wrote.
on:
  pull_request_target:
    types: [opened, reopened]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  retarget:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      # The REST call and not `gh pr edit --base`: that command also reads the pull request's project
      # cards, and the classic-Projects API it uses for them is sunset — it fails the whole edit with a
      # GraphQL error while changing nothing.
      - name: Point the pull request at dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            -f base=dev --jq '"now targets " + .base.ref'
