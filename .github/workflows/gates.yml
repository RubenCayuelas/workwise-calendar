name: Gates

# The four checks that must pass before a commit, run before ANY merge into ANY branch: no `branches`
# filter, so a pull request is checked whatever it is aimed at — a feature branch, `dev`, or `main`.
# Nothing reaches a branch through a pull request without them.
#
# They run again in `windows-installer.yml`, deliberately. A tag can be pushed from any commit, and
# what that build produces installs itself on the shop PC without anyone downloading it.
on:
  pull_request:
  # Called by `windows-installer.yml`, so a tagged build runs the same four from one definition.
  workflow_call:

jobs:
  gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 exactly, checked by the step below rather than by the install: `--ignore-scripts`
      # skips the `preinstall` this guard normally is.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # A step of its own, because the install below skips the `preinstall` that usually does this —
      # and as a hook it was always too late anyway: npm runs a dependency's install scripts first.
      - name: Refuse to build on the wrong Node
        run: node scripts/require-node-22.mjs

      # `--ignore-scripts`, or npm runs `node-gyp rebuild` on `better-sqlite3` unasked: the package
      # carries a `binding.gyp` and declares no install script, which is npm's trigger for building it.
      # It ships a ready-made binary for every platform instead, so there is nothing here to build.
      - run: npm ci --ignore-scripts
      - run: npm run type-check
      - run: npm test
      - run: npm run lint
      - run: npm run build

      # `desktop/verify-package.mjs` checks the first of these too, but only on a tag — so a payload
      # that had lost the database binary was green on every pull request and failed the release
      # build. The second is the class of failure `--ignore-scripts` hides: a package npm would have
      # built arriving in the payload with nothing built. `better-sqlite3` is the allowed one, because
      # it ships a ready-made binary and the line above proves that binary is there.
      - name: Check what the build traced into the payload
        run: |
          test -f .next/standalone/node_modules/better-sqlite3/prebuilds/win32-x64.node
          ! find .next/standalone/node_modules -mindepth 2 -maxdepth 3 -name binding.gyp \
              -not -path '*/better-sqlite3/*' | grep .
